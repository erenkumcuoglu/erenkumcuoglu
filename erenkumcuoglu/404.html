<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="7; url=/">
<title>404 · Eren Kumcuoğlu</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#0B0F13;--ink:#F4F5F2;--ink-2:#C3C9CF;--muted:#9AA3AC;--rule:#29313A;--accent:#93A4FF;--on-accent:#10151A;color-scheme:dark;
--f-display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);display:flex;align-items:center;justify-content:center;text-align:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:34rem}
.code{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.err-img{display:block;width:90%;max-width:300px;height:auto;margin:20px auto 24px;border-radius:6px}
h1{font-weight:700;font-stretch:75%;font-size:clamp(38px,6vw,56px);line-height:.96;letter-spacing:-.02em}
p{margin-top:14px;font-size:17px;line-height:1.55;color:var(--ink-2)}
.count{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
a.home{display:inline-flex;align-items:center;gap:10px;min-height:48px;margin-top:28px;padding:12px 22px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:16px;border-radius:2px;transition:background .2s,color .2s}
a.home:hover,a.home:focus-visible{background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:no-preference){main{animation:up .7s cubic-bezier(.2,.7,.1,1) both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main>
<div class="code">Error 404</div>
<img src="/404-eren-kumcuoglu.png" alt="An astronaut floating in space" class="err-img" width="850" height="620">
<h1>This page doesn&rsquo;t exist.</h1>
<p>You&rsquo;ll be taken to the homepage in <span class="count" id="count">7</span>&nbsp;seconds.</p>
<a class="home" href="/">Go home now <span aria-hidden="true">→</span></a>
</main>
<script>
(function(){var s=7,el=document.getElementById("count");var t=setInterval(function(){s-=1;if(el)el.textContent=s;if(s<=0){clearInterval(t);window.location.replace("/")}},1000)})();
</script>
</body>
</html>
