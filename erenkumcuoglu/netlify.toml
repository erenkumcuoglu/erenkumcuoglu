# Permanent redirect: old URL → new URL (preserves SEO juice)
[[redirects]]
  from = "/professional-milestones"
  to = "/career-journey"
  status = 301
  force = true

[[redirects]]
  from = "/professional-milestones/*"
  to = "/career-journey/:splat"
  status = 301
  force = true

# Existing blog redirects
[[redirects]]
  from = "/blog"
  to = "https://erenkumcuoglublog.netlify.app/blog/"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://erenkumcuoglublog.netlify.app/blog/:splat"
  status = 200
  force = true
